<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termo PWA</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css">
    <meta name="theme-color" content="#121213">
</head>
<body>
    <header>
        <div class="header-left">
            <select id="mode-selector">
                <option value="infinito">Infinito</option>
                <option value="hard">Hard Mode</option>
                <option value="speed">Speed</option>
                <option value="maratona">Maratona</option>
                <option value="dordle">Dordle</option>
                <option value="quordle">Quordle</option>
            </select>
        </div>
        <h1 id="title">TERMO</h1>
        <div class="header-actions">
            <button id="btn-stats" title="Estatísticas">📊</button>
            <button id="btn-settings" title="Configurações">⚙️</button>
        </div>
    </header>
    
    <div id="game-container">
        <div id="boards-wrapper"></div>
    </div>

    <div id="keyboard"></div>

    <div id="message-container"></div>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden"></div>
    
    <div id="settings-modal" class="modal hidden">
        <h2>Configurações</h2>
        <div class="modal-content">
            <button id="btn-install" class="action-btn" style="display: none;">📥 Instalar Aplicativo (PWA)</button>
            <p id="install-msg" style="font-size: 0.9rem; color: #818384;">O aplicativo já está instalado ou seu navegador não suporta a instalação direta.</p>
        </div>
        <button class="close-modal action-btn">Fechar</button>
    </div>

    <!-- O dicionário injeta window.WORD_DATA -->
    <script src="./data/words.js"></script>
    <script src="./src/app.js" type="module"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
